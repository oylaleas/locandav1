<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      Viewport fluido: zoom do sistema permitido (WCAG 1.4.4). No totem o
      painel Acessibilidade continua sendo o controle principal de leitura.
      viewport-fit=cover respeita notch / Dynamic Island / home indicator.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#065895" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Totem interativo da Locanda dei Venti." />
    <meta name="robots" content="noindex" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Locanda dei Venti" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.png" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <title>Locanda dei Venti — Totem</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: Georgia, serif; padding: 4rem; text-align: center">
        <img
          src="/icons/icon-192.png"
          alt="Emblema da Locanda dei Venti"
          width="80"
          height="80"
          style="border-radius: 1rem; margin-bottom: 1rem"
        />
        <h1>Locanda dei Venti</h1>
        <p>É necessário habilitar o JavaScript para utilizar este totem.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
