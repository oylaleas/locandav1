<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      Kiosk: viewport travado. O zoom por pinça é substituído pelo controle de
      acessibilidade interno (tamanho de texto + alto contraste), padrão usual
      em totens públicos. [VALIDAR NO HARDWARE REAL]
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#065895" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Totem interativo da Locanda dei Venti." />
    <meta name="robots" content="noindex" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Locanda dei Venti" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.png" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <title>Locanda dei Venti — Totem</title>
  </head>
  <body>
    <div id="root">
      <p id="boot-status" aria-live="polite" style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center">
        Carregando experiência…
      </p>
    </div>
    <noscript>
      <div style="font-family: Georgia, serif; padding: 4rem; text-align: center">
        <img
          src="/icons/icon-192.png"
          alt="Emblema da Locanda dei Venti"
          width="80"
          height="80"
          style="border-radius: 1rem; margin-bottom: 1rem"
        />
        <h1>Locanda dei Venti</h1>
        <p>É necessário habilitar o JavaScript para utilizar este totem.</p>
      </div>
    </noscript>
    <div id="legacy-browser" hidden role="alert" style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center">
      <h1>Atualize o navegador do totem</h1>
      <p>Esta experiência precisa de uma versão recente do Google Chrome ou Android System WebView.</p>
      <p>Abra novamente após atualizar o navegador.</p>
    </div>
    <script nomodule>
      /* O build injeta um bundle legacy para WebViews antigos. Só mostramos a
         orientação de atualização se esse fallback também não substituir a
         mensagem de boot em alguns segundos. */
      (function () {
        window.setTimeout(function () {
          var root = document.getElementById('root');
          var message = document.getElementById('legacy-browser');
          if (!root || !message || root.textContent.indexOf('Carregando experiência') === -1) return;
          root.setAttribute('hidden', 'hidden');
          message.removeAttribute('hidden');
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
