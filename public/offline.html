<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B2320" />
    <title>Locanda dei Venti</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 3rem;
        background: linear-gradient(180deg, #05406b 0%, #042b47 55%, #011a2c 100%);
        color: #f7f2e9;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      img.logo {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        margin: 0 auto 1.5rem;
        display: block;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
      h1 {
        font-family: 'Iowan Old Style', Palatino, Georgia, serif;
        font-weight: 400;
        font-size: clamp(2rem, 5vw, 3.5rem);
        letter-spacing: 0.02em;
        margin: 0 0 1rem;
      }
      p {
        font-size: clamp(1rem, 2.2vw, 1.4rem);
        max-width: 32ch;
        margin: 0 auto 2.5rem;
        color: rgba(247, 242, 233, 0.78);
        line-height: 1.6;
      }
      button {
        font: inherit;
        font-size: clamp(1rem, 2vw, 1.25rem);
        min-height: 4.5rem;
        padding: 0 2.5rem;
        border: none;
        border-radius: 999px;
        background: #f1b100;
        color: #042b47;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/icons/icon-192.png" alt="Emblema da Locanda dei Venti" width="96" height="96" />
      <h1>Locanda dei Venti</h1>
      <p>
        O totem está temporariamente sem conexão e este conteúdo ainda não foi armazenado no
        aparelho.
      </p>
      <button type="button" onclick="location.replace('/')">Voltar ao início</button>
    </main>
  </body>
</html>
